<div class="from-container">
    <div class="role-badge">
        {{ currentRoleLabel }} Portal
    </div>

    <div class="choose-option">
        <button type="button" [class.active]="isLoginMode" (click)="toggleMode()">Login</button>
        <button type="button" [class.active]="!isLoginMode" (click)="toggleMode()">Signup</button>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="f-group" *ngIf="!isLoginMode">
            <label>Full Name</label>
            <input
                type="text"
                [(ngModel)]="authData.fullName"
                name="fullName"
                required
                (input)="clearMessages()">
        </div>

        <div class="f-group">
            <label>Email</label>
            <input
                type="email"
                [(ngModel)]="authData.email"
                name="email"
                required
                (input)="clearMessages()">
        </div>

        <div class="f-group" *ngIf="!isLoginMode">
            <label>Phone Number</label>
            <input
                type="text"
                [(ngModel)]="authData.phone"
                name="phone"
                maxlength="10"
                required
                (input)="clearMessages()">
        </div>

        <div class="f-group">
            <label>Password</label>
            <input
                type="password"
                [(ngModel)]="authData.password"
                name="password"
                required
                (input)="clearMessages()">
        </div>

        <div class="forgot-password-row" *ngIf="isLoginMode">
            <button type="button" class="forgot-password-btn" (click)="openForgotPasswordModal()">
                Forgot Password?
            </button>
        </div>

        <div class="f-group" *ngIf="!isLoginMode">
            <label>Confirm Password</label>
            <input
                type="password"
                [(ngModel)]="authData.confirmPassword"
                name="confirmPassword"
                required
                (input)="clearMessages()">
        </div>

        <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-alert">{{ successMessage }}</div>

        <button type="submit" class="submit-btn" [disabled]="isSubmittingAuth">
            {{ isSubmittingAuth ? 'Please wait...' : isLoginMode ? 'Login' : 'Create Account' }}
        </button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <button type="button" class="google-btn" (click)="loginWithGoogle()" [disabled]="isSubmittingAuth">
        <img src="/google-icon.png" alt="Google" class="google-icon-img">
        <span>Continue with Google</span>
    </button>
</div>

<div class="modal-overlay" *ngIf="forgotPasswordModalOpen">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Reset Password</h2>
            <button type="button" class="close-btn" (click)="closeForgotPasswordModal()">×</button>
        </div>

        <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-alert">{{ successMessage }}</div>

        <div *ngIf="forgotStep === 'email'">
            <div class="f-group">
                <label>Email</label>
                <input
                    type="email"
                    [(ngModel)]="forgotPasswordData.email"
                    name="forgotEmail"
                    (input)="clearMessages()">
            </div>

            <button
                type="button"
                class="submit-btn"
                (click)="sendOtp()"
                [disabled]="isSendingOtp || resendCooldown > 0">
                {{
                    isSendingOtp
                        ? 'Sending OTP...'
                        : resendCooldown > 0
                        ? 'Wait ' + resendCooldown + 's'
                        : 'Send OTP'
                }}
            </button>
        </div>

        <div *ngIf="forgotStep === 'otp'">
            <div class="f-group">
                <label>Email</label>
                <input
                    type="email"
                    [(ngModel)]="forgotPasswordData.email"
                    name="verifyEmail"
                    readonly>
            </div>

            <div class="f-group">
                <label>OTP</label>
                <input
                    type="text"
                    [(ngModel)]="forgotPasswordData.otp"
                    name="otp"
                    maxlength="6"
                    (input)="clearMessages()">
            </div>

            <p class="otp-timer" *ngIf="otpTimer > 0">OTP expires in {{ otpTimer }} seconds</p>
            <p class="otp-expired" *ngIf="otpTimer === 0">OTP expired or invalid. Please resend OTP.</p>

            <button
                type="button"
                class="submit-btn"
                (click)="verifyOtp()"
                [disabled]="isVerifyingOtp">
                {{ isVerifyingOtp ? 'Verifying OTP...' : 'Verify OTP' }}
            </button>

            <div class="resend-row">
                <button
                    type="button"
                    class="resend-link-btn"
                    (click)="resendOtp()"
                    [disabled]="isSendingOtp || resendCooldown > 0">
                    {{
                        isSendingOtp
                            ? 'Sending OTP...'
                            : resendCooldown > 0
                            ? 'Resend in ' + resendCooldown + 's'
                            : 'Resend OTP'
                    }}
                </button>
            </div>
        </div>

        <div *ngIf="forgotStep === 'reset'">
            <div class="f-group">
                <label>New Password</label>
                <input
                    type="password"
                    [(ngModel)]="forgotPasswordData.password"
                    name="newPassword"
                    (input)="clearMessages()">
            </div>

            <div class="f-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    [(ngModel)]="forgotPasswordData.confirmPassword"
                    name="newConfirmPassword"
                    (input)="clearMessages()">
            </div>

            <button
                type="button"
                class="submit-btn"
                (click)="submitNewPassword()"
                [disabled]="isResettingPassword">
                {{ isResettingPassword ? 'Saving Password...' : 'Save Password' }}
            </button>
        </div>
    </div>
</div>
